[build]
  command = "npm run build:checked"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify detects Next.js and installs its OpenNext adapter automatically.
# Set the five variables from .env.example for the production context only.
# The dev branch and Deploy Previews require separate credentials; login stays disabled while unconfigured.
