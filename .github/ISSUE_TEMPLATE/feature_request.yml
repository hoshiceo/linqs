name: 機能の提案
description: 学習支援や運用を改善する提案を共有します。
body:
  - type: markdown
    attributes:
      value: 実際の受講者の氏名・質問・私的な教材や認証情報は記載しないでください。
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する動作
    validations:
      required: true
